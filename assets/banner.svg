<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="1" />
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="glow1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="240" rx="14" fill="url(#bgGrad)" />
  <rect width="1000" height="240" rx="14" fill="url(#grid)" />
  <rect width="1000" height="240" rx="14" fill="url(#glow1)" />
  <rect width="1000" height="240" rx="14" fill="url(#glow2)" />

  <!-- Subtle Border -->
  <rect x="1" y="1" width="998" height="238" rx="13" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- Top & Bottom Accent Lines -->
  <rect x="150" y="0.5" width="700" height="2" fill="url(#accentGrad)" />
  <rect x="250" y="237.5" width="500" height="1.5" fill="url(#accentGrad)" opacity="0.6" />

  <!-- Subtle AI Node Network Decoration (Left & Right) -->
  <g stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1" fill="#38BDF8" fill-opacity="0.35">
    <line x1="55" y1="65" x2="105" y2="95" />
    <line x1="105" y1="95" x2="75" y2="155" />
    <line x1="105" y1="95" x2="145" y2="60" />
    <circle cx="55" cy="65" r="3" />
    <circle cx="105" cy="95" r="4" />
    <circle cx="75" cy="155" r="2.5" />
    <circle cx="145" cy="60" r="2" />

    <line x1="945" y1="70" x2="895" y2="105" />
    <line x1="895" y1="105" x2="925" y2="165" />
    <line x1="895" y1="105" x2="855" y2="65" />
    <circle cx="945" cy="70" r="3" />
    <circle cx="895" cy="105" r="4" />
    <circle cx="925" cy="165" r="2.5" />
    <circle cx="855" cy="65" r="2" />
  </g>

  <!-- Main Name -->
  <text x="500" y="92" text-anchor="middle" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="1">
    YOUSEF ELGOHARY
  </text>

  <!-- Role Title -->
  <text x="500" y="134" text-anchor="middle" fill="#38BDF8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18.5" font-weight="600" letter-spacing="2.5">
    AI ENGINEER  ·  NLP &amp; LLMs
  </text>

  <!-- Divider Pill -->
  <rect x="460" y="154" width="80" height="2" rx="1" fill="#334155" />

  <!-- Value Proposition Subtitle -->
  <text x="500" y="185" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" letter-spacing="0.4">
    Agentic Workflows  •  Advanced RAG Systems  •  Scalable Python &amp; FastAPI Backends
  </text>
</svg>
